  <script>/* MeridianData — talks to Supabase from the browser (anon key + user login; RLS decides what you may see). */
(function(){
const LS='meridian_cfg',SS='meridian_sess',MD={L:new Set(),snapV:{on:false},timer:0,agents:null};
MD.cfg=()=>{try{const c=JSON.parse(localStorage.getItem(LS)||'{}');const w=window.MERIDIAN_CONFIG||{};return{url:(c.url||w.url||'').replace(/\/+$/,''),anon:c.anon||w.anon||''}}catch(e){return{url:'',anon:''}}};
MD.configured=()=>{const c=MD.cfg();return !!(c.url&&c.anon)};
MD.saveCfg=(url,anon)=>localStorage.setItem(LS,JSON.stringify({url:url.trim().replace(/\/+$/,''),anon:anon.trim()}));
const sess=()=>{try{return JSON.parse(sessionStorage.getItem(SS)||'null')}catch(e){return null}};
MD.hasSession=()=>!!sess();MD.email=()=>(sess()||{}).email||'';
const keep=(j,email)=>sessionStorage.setItem(SS,JSON.stringify({access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,email:email||(j.user&&j.user.email)||''}));
async function tok(){let s=sess();if(!s)throw new Error('not signed in');if(s.exp-Date.now()<60000){const c=MD.cfg();const r=await fetch(c.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:c.anon,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh})});const j=await r.json();if(!r.ok){MD.signOut();throw new Error('session expired')}keep(j,s.email);s=sess()}return s.access}
MD.signIn=async(email,pw)=>{const c=MD.cfg();const r=await fetch(c.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:c.anon,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error_description||j.msg||'Login failed');keep(j,email);MD.poll()};
MD.signOut=()=>{sessionStorage.removeItem(SS);clearTimeout(MD.timer);MD.timer=0;MD.set({on:false})};
async function api(path,opt){const c=MD.cfg(),t=await tok();const r=await fetch(c.url+'/rest/v1/'+path,Object.assign({headers:Object.assign({apikey:c.anon,Authorization:'Bearer '+t,'Content-Type':'application/json'},(opt&&opt.headers)||{})},opt&&{method:opt.method,body:opt.body}));if(!r.ok)throw new Error(path.split('?')[0]+': '+r.status+' '+(await r.text()).slice(0,120));return r.status===204?null:r.json()}
MD.checkUrl=async()=>{const c=MD.cfg(),out=[];if(!c.url||!c.anon){return[{ok:false,name:'Settings',detail:'Enter URL and anon key'}]}
 try{const r=await fetch(c.url+'/auth/v1/settings',{headers:{apikey:c.anon}});if(!r.ok)throw new Error(r.status);const j=await r.json();out.push({ok:true,name:'Supabase reachable',detail:c.url});out.push(j.disable_signup===false?{ok:false,name:'Sign-ups are ON',detail:'Turn OFF "Allow new users to sign up" in Supabase → Authentication'}:{ok:true,name:'Public sign-ups off',detail:'only users you create can log in'})}catch(e){out.push({ok:false,name:'Cannot reach Supabase',detail:'check the URL / anon key ('+e.message+')'})}
 return out};
MD.checkData=async()=>{const out=[];for(const t of ['heartbeat','trades','proposals','journal','decisions','equity']){try{const r=await api(t+'?select=*&limit=1');out.push({ok:true,name:'Table '+t,detail:r.length?'has data':'empty (ok)'})}catch(e){out.push({ok:false,name:'Table '+t,detail:e.message+' — run 001+002 SQL and add your email to owners'})}}
 const hb=MD.snapV;out.push(hb.hbAge==null?{ok:false,name:'Backend heartbeat',detail:'none yet — start python main.py'}:{ok:!hb.stale,name:'Backend heartbeat',detail:Math.round(hb.hbAge/1000)+'s ago'+(hb.stale?' (backend looks OFFLINE)':'')});return out};
MD.decide=async(action,proposal_id,symbol,note)=>{const b={action};if(proposal_id!=null)b.proposal_id=proposal_id;if(symbol)b.symbol=symbol;if(note)b.note=note;await api('decisions',{method:'POST',body:JSON.stringify(b),headers:{Prefer:'return=minimal'}});setTimeout(MD.poll,1500)};
const f2=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:0}),sg=n=>(n>=0?'+':'-')+'$'+f2(Math.abs(n)),hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
function build(hb,tr,pr,jr,eq){const st=(hb&&hb.state)||{},age=hb?Date.now()-new Date(hb.ts).getTime():null,stale=age==null||age>180000;
 const opn=tr.filter(t=>t.status==='open'),cap=st.capital||10000,e=st.equity||cap,pct=(e/cap-1)*100,dp=st.day_pnl||0,series=eq.map(x=>+x.equity).reverse().slice(-80);
 let pk=0,dd=0;series.forEach(v=>{pk=Math.max(pk,v);dd=Math.min(dd,(v/pk-1)*100)});
 let curve=null,lastY=14,parts=['Open','Mid','Now'].map(l=>l+' —');if(series.length>1){const mn=Math.min(...series),mx=Math.max(...series),rg=(mx-mn)||1;const pts=series.map((v,i)=>[Math.round(i/(series.length-1)*440),Math.round(100-(v-mn)/rg*86)]);curve=pts.map(p=>p.join(',')).join(' ');lastY=pts[pts.length-1][1];const s0=series[0];parts=[['Start',0],['Mid',series[Math.floor(series.length/2)]-s0],['Now',series[series.length-1]-s0]].map(([l,v])=>l+' '+sg(v))}
 const loss=Math.max(0,-(st.day_pnl_pct||0)),lim=st.loss_limit||1;
 const kpis=[{label:'Equity',value:'$'+f2(e),delta:(pct>=0?'+':'')+pct.toFixed(2)+'%',good:pct>=0},{label:'Daily P&L',value:sg(dp),delta:'Today',good:dp>=0},{label:'Win Rate',value:st.win_rate==null?'—':st.win_rate+'%',delta:(st.closed||0)+' closed',good:true},{label:'Positions',value:String(opn.length),delta:'Paper',good:true},{label:'Drawdown',value:dd.toFixed(1)+'%',delta:'Equity curve',good:dd>-1.5}];
 const infra=[['Backend',stale?'OFFLINE':'ONLINE',stale?'#ff5d6a':'#2fe07a'],['Supabase','LIVE','#5aa8ff'],['Price feed',String(st.feed||'—').toUpperCase(),'#2fe07a'],['Web research ('+((st.research&&st.research.search)||'—')+')',st.research&&st.research.on?'ON · '+st.research.level:'OFF',st.research&&st.research.on?'#2fe07a':'#93a7ba'],['AI brain ('+((st.llm||':').split(':')[0]||'none')+')',(st.llm||':')===':'?'NOT SET':(st.llm_ok===false?'FAILING':'ONLINE'),(st.llm||':')===':'||st.llm_ok===false?'#ff5d6a':'#2fe07a'],['Kill-switch',st.kill?'TRIPPED':'ARMED',st.kill?'#ff5d6a':'#2fe07a'],['Mode','PAPER ONLY','#ffb224']];
 const logs=jr.map(j=>({time:hm(j.created_at),agent:String(j.agent).toUpperCase(),text:j.thought,tag:j.action}));
 const s={on:true,stale,hbAge:age,state:st,kill:!!st.kill,killReason:st.kill_reason,positions:opn.map(t=>({sym:t.symbol,side:t.side,qty:t.qty,pnl:Math.round(t.pnl||0),price:+(t.last_price||t.entry)})),kpis,curve,lastY,parts,todayStr:sg(dp),dailyLossStr:loss.toFixed(2)+'% / '+lim+'%',dailyLossW:Math.min(100,loss/lim*100)+'%',tradesStr:(st.trades_today||0)+' / '+(st.max_trades||2),infra,logs,adx:st.adx==null?'—':st.adx,regime:st.regime||'—',proposals:pr,pending:pr.find(p=>p.status==='awaiting')||null,email:MD.email()};
 if(MD.agents)MD.agents.forEach(a=>{const d=(st.agents||{})[a.name];if(d)a.doing=d;const l=jr.find(j=>String(j.agent).toUpperCase()===a.name);if(l)a.log=hm(l.created_at)+' — '+l.thought;if(l&&a.name==='RISK')a.bubble='Risk '+l.action});return s}
MD.set=v=>{MD.snapV=v;MD.L.forEach(f=>f(v))};MD.snap=()=>MD.snapV;
MD.poll=async()=>{clearTimeout(MD.timer);MD.timer=0;if(!sess()||!MD.configured())return;try{const[hb,tr,pr,jr,eq]=await Promise.all([api('heartbeat?select=*&id=eq.1'),api('trades?select=*&order=id.desc&limit=500'),api('proposals?select=*&order=id.desc&limit=12'),api('journal?select=*&order=id.desc&limit=60'),api('equity?select=*&order=id.desc&limit=80')]);MD.set(build(hb[0],tr,pr,jr,eq))}catch(e){MD.set(Object.assign({},MD.snapV,{on:true,error:e.message,stale:true,positions:MD.snapV.positions||[],kpis:MD.snapV.kpis||[],logs:MD.snapV.logs||[],infra:MD.snapV.infra||[],proposals:MD.snapV.proposals||[],parts:MD.snapV.parts||['','',''],dailyLossStr:'—',dailyLossW:'0%',tradesStr:'—',todayStr:'—',lastY:14,adx:'—',regime:'—'}))}
 if(sess())MD.timer=setTimeout(MD.poll,8000)};
MD.subscribe=f=>{MD.L.add(f);if(sess()&&!MD.timer)MD.poll();return()=>MD.L.delete(f)};
MD.bindAgents=a=>{MD.agents=a};
window.MeridianData=MD;
})();
